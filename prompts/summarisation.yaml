schema_version: 1
# Fairy-style summarisation prompts, written for the CallCost benchmark (drafted with Claude, reviewed by Alex).
# All input texts are invented; names, places and numbers are fictional unless obviously generic.
# Inputs are deliberately noisy (quoted replies, tangents, boilerplate, distractors) so that the
# summary has to select, not copy. Checklists are fixed BEFORE any model sees these prompts.
# Requires the automatic check type `max_words` (count whitespace-separated words in the answer).
prompts:
  - id: summary-01
    task_type: summarisation
    prompt: "Summarise these meeting notes in at most three sentences for a club member who missed the meeting."
    input: |
      Python Club meeting, 14 Oct (notes by Leo, typed during the meeting, sorry for the mess)

      Started late, about 15:40, because the projector in B12 wouldn't connect to Marta's laptop again. We tried HDMI, then the USB-C adapter from the IT office, which also didn't work. Ended up crowding round one screen. Someone needs to ask IT about this properly, it's the third time.

      Attendance: 7 today. Two new people came (Year 10, Sofia and Arnav), both have done a bit of Scratch, Arnav has done some Python on his own.

      Recap of last session: we finished the list comprehension exercises. Most people got the nested one in the end. Marta said we should keep a shared doc of solutions, people agreed but nobody volunteered to maintain it, so that's still open.

      Long discussion about a club hackathon. Ideas: December, maybe a Saturday, maybe together with Math Club. Several people said mock exams are early December and they won't have time. Agreed to wait until after mocks and decide then. NO DATE SET. Also talked about a pizza budget for it, Ms. Ortiz said the school might cover it, but that depends on the date anyway.

      Next session: we can't have Tuesday 21 Oct because the room is booked for parents' evening setup. Moving to Thursday 23 Oct, same room B12, starting 15:30. Topic: recursion. Marta will prepare three warm-up problems. Leo brings his own projector adapter (the one that works).

      Off-topic: Arnav asked about competitive programming sites, people recommended Codeforces and the school's old USACO folder. Someone asked if the club could get school laptops, answer was probably not this term.

      Admin: we now have a GitHub organisation for the club. Anyone who wants an invite should message Leo by Friday with their GitHub username. After Friday he'll send the invites in one batch.

      Ended 16:35.
    scoring:
      type: checklist
      items:
        - id: thursday
          description: "States the next session is on Thursday."
          automatic: {type: substring, value: "Thursday", case_sensitive: false}
        - id: room
          description: "Mentions room B12."
          automatic: {type: substring, value: "B12", case_sensitive: false}
        - id: time
          description: "Mentions 15:30."
          automatic: {type: regex, pattern: "15[:.]30|3[:.]30 ?(pm|p\\.m\\.)", case_sensitive: false}
        - id: right_time
          description: "Gives 15:30 as the next session's start, not 15:40 (today's late start)."
          human: true
        - id: hackathon_undecided
          description: "If the hackathon is mentioned, says it has no date / is postponed; does not present December as fixed."
          human: true
        - id: github_deadline
          description: "Mentions messaging Leo by Friday for the GitHub invite."
          human: true
        - id: faithful
          description: "Adds no facts that are not in the notes."
          human: true
        - id: length
          description: "At most 80 words."
          automatic: {type: max_words, value: 80}

  - id: summary-02
    task_type: summarisation
    prompt: "Summarise this email thread in two sentences: what do I need to do, and by when?"
    input: |
      From: Mr. Costa
      To: Physics HL, Year 12
      Date: Wednesday 22 October, 08:12
      Subject: RE: RE: Physics lab report

      Hi all,

      Quick correction to Monday's message, sorry about the confusion. The lab report on the pendulum period is now due Friday 7 November at 23:59, not Monday 3 November as I wrote before. Several of you have the Chemistry test that Monday and Ms. Rahman asked if we could move it, which seemed fair.

      Everything else stays as it was: submit through the class portal as a single PDF (not Word, not Google Docs links, I can't annotate those). Please include your raw data table and an uncertainty for g. Reports over 6 pages will not be marked beyond page 6.

      If you were absent for the practical, ask Priya for the shared dataset rather than inventing values. I will check.

      Thanks,
      Mr. Costa
      Head of Physics
      Tel. ext. 214 | Office hours Tue/Thu 13:00 to 13:45
      This email and any attachments are confidential and intended solely for the addressee. If you have received it in error, please notify the sender and delete it.

      -----Original Message-----
      From: Priya S.
      Date: Tuesday 21 October, 19:40
      Subject: RE: Physics lab report

      Hi Mr Costa, is it ok if we use the class average for the length measurements? Mine got smudged. Also is the deadline still Monday?

      -----Original Message-----
      From: Mr. Costa
      Date: Monday 20 October, 16:05
      Subject: Physics lab report

      Hi all,
      Reminder that the lab report on the pendulum period is due Monday 3 November at 23:59. Submit through the class portal as a single PDF. Include your raw data table and an uncertainty for g. Max 6 pages. Remember to use the equipment-list template from the shared drive. Good luck, and enjoy the half-term break.
      Mr. Costa
    scoring:
      type: checklist
      items:
        - id: due_date
          description: "Gives 7 November as the due date."
          automatic: {type: regex, pattern: "7(th)? Nov|Nov(ember)? 7", case_sensitive: false}
        - id: due_time
          description: "Gives 23:59 (or 11:59 pm)."
          automatic: {type: regex, pattern: "23[:.]59|11[:.]59 ?(pm|p\\.m\\.)", case_sensitive: false}
        - id: pdf
          description: "Mentions a single PDF via the portal."
          automatic: {type: substring, value: "PDF", case_sensitive: false}
        - id: not_old_date
          description: "Does not present 3 November as the deadline."
          human: true
        - id: content_requirement
          description: "Mentions the raw data table or the uncertainty for g."
          human: true
        - id: faithful
          description: "Adds no facts that are not in the thread; does not turn Priya's question into an instruction."
          human: true
        - id: length
          description: "At most 60 words."
          automatic: {type: max_words, value: 60}

  - id: summary-03
    task_type: summarisation
    prompt: "Summarise this issue thread in two sentences: first a one-line description a developer could use as a ticket title, then the likely cause."
    input: |
      Issue #214: Timer notification fires twice
      Opened by dmitri-k | labels: bug, notifications | 6 comments

      dmitri-k:
      Steps: set a 5-minute timer from the menu bar panel, lock the screen, unlock after the timer ends.
      Expected: one notification. Actual: two identical notifications, about 1 second apart.
      Happens on macOS 26.1, not on 25.6. Does not happen if the screen stays unlocked.
      Priority: low, but annoying.

      ana-v:
      +1, same on my MacBook Air. Also on 26.1.

      jules42:
      Could this be the Do Not Disturb setting? I had something similar with another app last year and turning off Focus fixed it.

      dmitri-k:
      @jules42 tried that, Focus is off and it still happens.

      ana-v:
      Not sure if related, but the dark mode icon in the menu bar looks slightly blurry on external monitors since the last update.

      rkoval (maintainer):
      Thanks all. The logs attached by dmitri-k show the scheduler registering the timer a second time when the app receives the unlock event, so the notification is delivered by both registrations. Workaround: none yet; restarting the app doesn't help. The blurry icon is a separate issue, @ana-v could you open a new one? Not planning a fix for 3.4.1, will look at it after.
    scoring:
      type: checklist
      items:
        - id: duplicate
          description: "Says the notification fires twice / is duplicated."
          automatic: {type: regex, pattern: "twice|two|duplicate", case_sensitive: false}
        - id: lock_condition
          description: "Mentions locking/unlocking the screen as the trigger."
          automatic: {type: regex, pattern: "lock", case_sensitive: false}
        - id: cause
          description: "Identifies the scheduler registering the timer again on unlock as the likely cause."
          human: true
        - id: not_focus
          description: "Does not present Focus / Do Not Disturb as the cause."
          human: true
        - id: no_fake_fix
          description: "Does not claim a workaround or fix exists."
          human: true
        - id: on_topic
          description: "Does not mix in the blurry icon issue."
          human: true
        - id: length
          description: "At most 60 words."
          automatic: {type: max_words, value: 60}

  - id: summary-04
    task_type: summarisation
    prompt: "Summarise the bike-share news in this article in exactly three bullet points."
    input: |
      Port Elmira approves bike-share expansion after heated session
      By Clara Mendes, City Desk

      Port Elmira's city council approved an expansion of the BiciPort bike-share on Tuesday evening, after a session that ran more than two hours over schedule.

      The network, launched in 2019 with 25 stations near the harbour, will grow from its current 40 to 65 stations by June next year, with 300 new e-bikes added to the fleet. The new stations will mostly serve the northern residential districts and the university campus, which councillors said had been "left out" of the first phase.

      The expansion costs EUR 2.1 million, of which EUR 1.4 million comes from a regional transport grant; the rest comes from the city's mobility budget. Annual membership rises from EUR 35 to EUR 42, the first increase since launch. Single rides stay at EUR 1.

      "Usage grew 18% last year, mostly among commuters," said Councillor Ana Ferrer, who has championed the scheme. "People are voting with their legs."

      Opposition councillors voted against, arguing the money should go to bus frequency instead. "Buses carry ten times more people," said Councillor Tomas Riera. The motion passed by 14 votes to 9.

      Construction of the first ten stations starts in March.

      In other council business, members postponed a vote on extending terrace hours for harbour-front restaurants and approved renaming Plaza Nova to Plaza de la Marina, effective in January. A public consultation on the city's new parking zones opens next week.
    scoring:
      type: checklist
      items:
        - id: stations
          description: "Mentions growth to 65 stations."
          automatic: {type: substring, value: "65", case_sensitive: false}
        - id: cost
          description: "Mentions the EUR 2.1 million cost."
          automatic: {type: regex, pattern: "2[.,]1 ?(million|m\\b)", case_sensitive: false}
        - id: membership
          description: "Mentions the membership price rising to EUR 42."
          automatic: {type: substring, value: "42", case_sensitive: false}
        - id: three_bullets
          description: "Exactly three bullet points."
          human: true
        - id: single_ride
          description: "Does not claim the single-ride price changes."
          human: true
        - id: on_topic
          description: "Does not include the unrelated council business (terraces, renaming, parking)."
          human: true
        - id: length
          description: "At most 90 words."
          automatic: {type: max_words, value: 90}

