  - id: summary-06
    task_type: summarisation
    prompt: "Summarise these release notes for a user deciding whether to update, in at most four bullet points."
    input: |
      Notely 3.4 release notes (build 3412)

      Highlights
      - Offline mode for notes created in the last 30 days.
      - Search now matches text inside PDF attachments.

      Changed
      - Sync interval reduced from 10 minutes to 2 minutes on Wi-Fi; on mobile data it stays at 10 minutes.
      - The free plan now allows 3 devices instead of 2.
      - Default editor font size increased slightly (from 14 to 15 pt). You can change it back in Settings > Editor.
      - The Share menu has been reordered so that "Copy link" appears first.
      - Updated translations: Catalan, Polish, Vietnamese.

      Fixed
      - Crash when renaming a folder whose name contains an emoji.
      - Low contrast in dark mode on the tag picker.
      - Checkbox state sometimes not saved when the note was closed within 1 second.
      - Typo on the onboarding screen ("Wellcome").
      - Rare issue where the app icon badge showed a count of -1.

      Removed
      - The legacy Evernote importer. Use the new universal importer instead (File > Import).

      Known issues
      - Offline edits to shared notes may create duplicates; a fix is planned for 3.4.1.
      - On some Android 13 devices, the widget may need to be re-added after updating.

      Thank you to everyone in the beta programme, especially the 1,200 testers who sent feedback this cycle.
    scoring:
      type: checklist
      items:
        - id: offline
          description: "Mentions the new offline mode."
          automatic: {type: substring, value: "offline", case_sensitive: false}
        - id: devices
          description: "Mentions the free plan allowing 3 devices."
          automatic: {type: regex, pattern: "(3|three) devices", case_sensitive: false}
        - id: importer_removed
          description: "Mentions removal of the Evernote importer."
          human: true
        - id: known_issue
          description: "Mentions the duplicate-notes known issue."
          human: true
        - id: sync_scope
          description: "Does not claim sync is every 2 minutes on mobile data."
          human: true
        - id: bullets
          description: "At most four bullet points."
          human: true
        - id: length
          description: "At most 90 words."
          automatic: {type: max_words, value: 90}

  - id: summary-07
    task_type: summarisation
    prompt: "Summarise this practical sheet in three sentences for a student who will do the practical tomorrow."
    input: |
      Practical 4: Specific heat capacity of an aluminium block
      IB Physics, Topic B.1

      Background
      The specific heat capacity c of a material is the energy needed to raise the temperature of 1 kg of it by 1 K. In this practical you supply a known amount of electrical energy to a metal block and measure its temperature rise. You met the equation Q = mc deltaT in the previous lesson.

      Equipment
      Aluminium block (about 1 kg) with two holes, 12 V heater, thermometer or temperature probe, power supply, ammeter, voltmeter, stopwatch, top-pan balance, small dropper of oil, insulating jacket (optional), heat-proof mat.

      Risk assessment
      The heater and block become hot enough to burn. The heater stays hot for several minutes after switch-off; do not touch it or remove it from the block until your teacher says it is safe. Keep water away from the power supply.

      Method
      1. Measure the block's mass on the top-pan balance (record to 0.1 g).
      2. Insert the heater and the thermometer; add a drop of oil to each hole for thermal contact.
      3. Record the starting temperature, then switch on and start the stopwatch at the same moment.
      4. Record voltage and current every minute; they should stay roughly constant.
      5. Switch off after 10 minutes but keep recording the temperature until it stops rising. Use the maximum temperature, not the temperature at switch-off.
      6. Calculate c = VIt / (m x deltaT).

      Analysis and evaluation
      Expect a value below the textbook 900 J/kg K because of heat loss to the surroundings; insulating the block reduces the gap. In your evaluation, discuss at least two sources of uncertainty and how they affect your result. Extension: repeat with the insulating jacket and compare.

      The write-up is due one week after the practical. Use the standard template.
    scoring:
      type: checklist
      items:
        - id: duration
          description: "Mentions heating for 10 minutes."
          automatic: {type: regex, pattern: "10 ?min|ten min", case_sensitive: false}
        - id: max_temp
          description: "Says to use the maximum temperature reached after switch-off."
          human: true
        - id: calculation
          description: "Gives the formula or says energy is calculated from voltage, current and time."
          human: true
        - id: safety
          description: "Mentions that the heater stays hot after switch-off."
          human: true
        - id: faithful
          description: "Adds no facts or numbers that are not in the sheet."
          human: true
        - id: length
          description: "At most 90 words."
          automatic: {type: max_words, value: 90}

  - id: summary-08
    task_type: summarisation
    prompt: "In two sentences, tell a resident who lives on the 4th floor what this notice means for them on 12 November."
    input: |
      Edifici Albada, notice to residents, October

      1. Water shut-off
      Water will be shut off on Wednesday 12 November from 09:00 to 14:00 for pipe replacement on floors 3 to 6. Floors 1 and 2 are not affected. Please fill containers in advance if needed. If the work finishes early, water will be restored without further notice.

      2. Lift
      The lift will be out of service from 08:00 to 12:00 the same day while materials are moved. Residents with reduced mobility who need assistance should contact the administrator's office in advance.

      3. Recycling
      From November, the glass container moves from the entrance to the courtyard, next to the bicycle racks. Please do not leave glass outside the container.

      4. Community fees
      The quarterly community fee will be charged on 5 November as usual. The amount does not change.

      5. Facade painting
      The facade painting planned for October has been postponed to spring because of the weather. Balconies do not need to be cleared yet.

      6. Lost and found
      A child's blue scooter has been found in the courtyard. It is in the porter's lodge.

      Questions: the administrator's office, weekdays 10:00 to 13:00.
      Thank you for your cooperation.
    scoring:
      type: checklist
      items:
        - id: start
          description: "Gives 09:00 as the water shut-off start."
          automatic: {type: regex, pattern: "0?9[:.]00|9 ?(am|a\\.m\\.)", case_sensitive: false}
        - id: end
          description: "Gives 14:00 as the water shut-off end."
          automatic: {type: regex, pattern: "14[:.]00|2 ?(pm|p\\.m\\.)", case_sensitive: false}
        - id: affected
          description: "Makes clear the 4th-floor resident is affected by the water cut."
          human: true
        - id: lift
          description: "Mentions the lift being out of service 08:00 to 12:00."
          human: true
        - id: on_topic
          description: "Does not include items unrelated to 12 November (recycling, fees, painting, scooter)."
          human: true
        - id: length
          description: "At most 60 words."
          automatic: {type: max_words, value: 60}

  - id: summary-09
    task_type: summarisation
    prompt: "Summarise this press release in two sentences, including the main result and one limitation."
    input: |
      Press release, Northfield University, 9 October

      Study finds short naps may help students' afternoon maths

      A new study from Northfield University's Department of Education suggests that a short nap after lunch may modestly improve secondary-school students' performance in afternoon arithmetic.

      "Naps are basically a free grade boost," said co-author Dr. Helen Marsh. "Every school should build them into the timetable."

      The study, published in the Northfield Review of Education, followed 96 secondary-school students who were randomly assigned to a 20-minute nap, a 20-minute quiet rest, or normal activity after lunch, on three non-consecutive days. They then sat a 15-minute arithmetic test.

      The nap group scored 6% higher than the normal-activity group (p = 0.03). Quiet rest scored 3% higher, which was not statistically significant. Students who slept longer than 25 minutes performed worse than the quiet-rest group.

      The authors note several limitations: the study took place in a single school, sleep onset was self-reported, and follow-up was short. "We need larger, multi-school trials before making firm recommendations," the paper concludes.

      The research was funded by the Northfield Education Trust. Northfield University is ranked among the top 50 universities in the country for education research. For media enquiries, contact the press office.
    scoring:
      type: checklist
      items:
        - id: main_result
          description: "Gives the 6% improvement for the nap group."
          automatic: {type: regex, pattern: "6 ?%|6 per ?cent|six per ?cent", case_sensitive: false}
        - id: limitation
          description: "Names at least one stated limitation."
          human: true
        - id: quiet_rest
          description: "Does not claim quiet rest had a significant effect."
          human: true
        - id: hedged
          description: "Does not repeat the co-author's overstatement (free grade boost, every school should) as the finding."
          human: true
        - id: faithful
          description: "Adds no facts that are not in the press release."
          human: true
        - id: length
          description: "At most 70 words."
          automatic: {type: max_words, value: 70}

  - id: summary-10
