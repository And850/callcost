[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "callcost"
version = "0.0.1"
description = "Measure per-call LLM cost and task quality on your Mac"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Andrii (And850)"}]

[project.urls]
Repository = "https://github.com/And850/callcost"

[tool.setuptools.packages.find]
where = ["src"]
