[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "callcost"
version = "0.0.1"
description = "Measure per-call LLM cost and task quality on your Mac"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Andrii (And850)"}]
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7", "psutil>=7,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
plots = ["reportlab>=4,<5"]

[project.scripts]
callcost = "callcost.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
Repository = "https://github.com/And850/callcost"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
